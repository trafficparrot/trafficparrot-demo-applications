# Builds and tests the Maven apps a push to master or a pull request changes, each on the Java it
# targets, and makes the download zips. A change under .github/, a manual run and a release build
# every app. The release workflow calls it to build the zips from a tagged commit.
name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    name: Pick the apps to build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.pick.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: .github/scripts/changed-apps.sh >> "$GITHUB_OUTPUT"

  app:
    name: ${{ matrix.app }}
    needs: select
    if: needs.select.outputs.apps != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # .github/apps.json lists every app. release: a release carries its download zip,
      # <app>-<version>.zip, the version taken from the app's pom. args: extra Maven arguments
      # (fedex-tracking-application's acceptance tests drive a browser against FedEx's sandbox
      # and need a FedEx API key).
      # thrift: the build generates code with the Thrift compiler, built here from Apache's source.
      matrix:
        include: ${{ fromJSON(needs.select.outputs.apps) }}
    env:
      APP: ${{ matrix.app }}
      MAVEN_EXTRA_ARGS: ${{ matrix.args }}
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: ${{ matrix.app }}/**/pom.xml
      - name: Build the Thrift compiler
        if: matrix.thrift
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bison flex
          .github/scripts/thrift-compiler.sh "$RUNNER_TEMP/thrift"
          echo "$RUNNER_TEMP/thrift" >> "$GITHUB_PATH"
      - name: Build and test
        run: mvn -B verify ${MAVEN_EXTRA_ARGS:+"$MAVEN_EXTRA_ARGS"}
      - name: Make the download zip
        if: matrix.release
        working-directory: .
        run: .github/scripts/package.sh "$APP"
      - name: Keep the zip for the release
        if: matrix.release && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.app }}
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
