# Keeps the action pins in the workflows and each app's Maven dependencies current. Security
# updates for a vulnerable dependency are a repository setting and arrive as soon as an alert
# opens, whatever this file says; the entries here add a scheduled check for newer versions,
# offering a release only once it is a week old, by which time a bad one has usually been pulled.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7

  # One pull request per app each month, carrying every Maven update that app has.
  # The list follows .github/apps.json.
  - package-ecosystem: maven
    directories:
      - /fruit-order-system
      - /vegetable-order-system
      - /flower-order-system
      - /food-order-system
      - /finance-application
      - /uv-index-application
      - /grpc-shop
      - /fedex-tracking-application
      - /thrift-calculator
      - /finance-application-2
      - /mobile-network-hardware
      - /mobile-numbers
      - /mobile-onboarding
      - /weather-in-london-application
      - /wiremock-weather-application
      - /weather-yatspec-example
      - /unit-converter-application
      - /example-buy-euro-application
      - /fix-sftp-fix
      - /demo-multiple-apis
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 20
    groups:
      maven:
        patterns: ["*"]
