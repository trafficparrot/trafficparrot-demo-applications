# Keeps the action pins in the workflows and the apps' Maven dependencies current. Security
# updates for a vulnerable dependency are a repository setting and arrive when an alert opens;
# the entries here add a scheduled check for newer versions, offering a release only once it is
# a week old, by which time a bad one has usually been pulled.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7

  # One pull request a month across the apps, carrying their minor and patch Maven updates.
  # Major versions are left out: each app targets a fixed Java (8 for some), and a new major
  # usually needs a newer Java or code changes, so those are made by hand.
  # The list follows .github/apps.json.
  - package-ecosystem: maven
    directories:
      - /fruit-order-system
      - /vegetable-order-system
      - /flower-order-system
      - /food-order-system
      - /finance-application
      - /uv-index-application
      - /grpc-shop
      - /fedex-tracking-application
      - /thrift-calculator
      - /finance-application-2
      - /mobile-network-hardware
      - /mobile-numbers
      - /mobile-onboarding
      - /weather-in-london-application
      - /wiremock-weather-application
      - /weather-sequence-diagram-example
      - /unit-converter-application
      - /example-buy-euro-application
      - /fix-sftp-fix
      - /demo-multiple-apis
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # allure-selenide is built for Java 17 from 2.28.0, following Selenide 7, and
      # fedex-tracking-application is on Java 8. Its pom sets every Allure library from one
      # version property, so all of them stay below 2.28.
      - dependency-name: "io.qameta.allure:*"
        versions: [">= 2.28.0"]
    groups:
      maven:
        patterns: ["*"]
